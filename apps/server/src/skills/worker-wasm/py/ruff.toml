# The Pyodide worker's Python takes the tier-2 runtime's rules and target
# (Pyodide 314 runs Python 3.14). CI's `skills-runtime` job checks this
# directory with the ruff that `images/skills/uv.lock` pins.
extend = "../../../../../../images/skills/pyproject.toml"
# The base's `include` globs resolve against this directory, where they
# match nothing.
include = ["*.py"]
