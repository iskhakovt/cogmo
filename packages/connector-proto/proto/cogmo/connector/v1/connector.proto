// The contract between cogmo and its connectors: processes outside cogmo that
// dial in, take jobs, and report their events and outcomes. The rules a
// connector follows are in design/connectors.md → Wire contract.
//
// Every call carries `authorization: Bearer <token>`, the token
// `cogmo connector add` printed.
syntax = "proto3";

package cogmo.connector.v1;

service ConnectorService {
  // The connector's session: cogmo sends jobs and cancels down it while it is open.
  rpc Connect(ConnectRequest) returns (stream ConnectResponse);
  // Connector to cogmo.
  rpc AcceptJob(AcceptJobRequest) returns (AcceptJobResponse); // idempotent on job_id
  rpc ReportEvents(ReportEventsRequest) returns (ReportEventsResponse); // idempotent on (job_id, seq)
  rpc FinishJob(FinishJobRequest) returns (FinishJobResponse); // idempotent on job_id
}

message ConnectRequest {
  repeated string held_job_ids = 1; // jobs it has persisted and still holds
  repeated string held_task_ids = 2; // tasks whose workspaces it holds
}

message ConnectResponse {
  oneof message {
    SessionAccepted accepted = 1; // first message
    Job job = 2;
    CancelJob cancel = 3;
    Heartbeat heartbeat = 4;
  }
}

// The jobs cogmo still awaits on this session. The connector stops any held
// job missing from it.
message SessionAccepted {
  repeated string awaited_job_ids = 1;
}

message CancelJob {
  string job_id = 1;
}

message Heartbeat {}

message Job {
  string job_id = 1; // "<task_id>/<phase>/<spec digest>"; opaque to connectors
  string task_id = 2;
  oneof spec {
    PrepareSpec prepare = 10;
    AgentTurnSpec plan = 11;
    AgentTurnSpec execute = 12;
    VerifySpec verify = 13;
    PublishSpec publish = 14;
    ReleaseSpec release = 15;
  }
}

message PrepareSpec {
  string remote_url = 1; // carries no password, and no userinfo for http(s)
  string base_branch = 2;
  string work_branch = 3;
}

message AgentTurnSpec {
  string prompt = 1;
  string agent = 2;
  uint64 token_budget = 3;
  optional string session_id = 4; // the plan's session handle, on execute
}

message VerifySpec {
  string command = 1;
  uint32 timeout_seconds = 2;
}

message PublishSpec {
  string commit_message = 1;
  string remote_ref = 2;
}

message ReleaseSpec {
  optional string salvage_ref = 1;
}

message AcceptJobRequest {
  string job_id = 1;
}

message AcceptJobResponse {}

message ReportEventsRequest {
  string job_id = 1;
  repeated JobEvent events = 2;
}

message ReportEventsResponse {}

message JobEvent {
  uint64 seq = 1; // strictly increasing per job, from 1
  oneof event {
    string text_delta = 2;
    ToolCall tool_call = 3;
    ToolResult tool_result = 4;
    Usage usage = 5;
  }
}

message ToolCall {
  string name = 1;
  string summary = 2;
}

message ToolResult {
  string name = 1;
  bool ok = 2;
  string summary = 3;
}

// Cumulative for the job.
message Usage {
  uint64 input_tokens = 1;
  uint64 output_tokens = 2;
  double cost_usd = 3;
}

message FinishJobRequest {
  string job_id = 1;
  oneof outcome {
    JobResult completed = 2;
    JobError failed = 3;
    Cancelled cancelled = 4;
  }
  uint64 last_seq = 5; // the last event seq it reported; 0 if none
}

message FinishJobResponse {}

message Cancelled {}

// The case matches the job's spec. A verify that runs and fails is a
// `completed` verdict, not a `failed` job.
message JobResult {
  oneof result {
    Prepared prepared = 1;
    PlanResult plan = 2;
    Executed executed = 3;
    VerifyVerdict verify = 4;
    Published published = 5;
    Released released = 6;
  }
}

message Prepared {}

message PlanResult {
  string plan = 1;
  string session_id = 2;
}

message Executed {
  Usage usage = 1;
}

message VerifyVerdict {
  int32 exit_code = 1;
  bool timed_out = 2;
  string output_tail = 3;
}

message Published {
  string head_sha = 1;
}

message Released {
  oneof outcome {
    RemovedClean removed_clean = 1;
    SalvagedAndRemoved salvaged_and_removed = 2;
    Kept kept = 3;
  }
}

message RemovedClean {}

message SalvagedAndRemoved {
  string salvage_ref = 1;
  string sha = 2;
}

message Kept {
  string reason = 1;
}

message JobError {
  JobErrorCode code = 1;
  string message = 2;
}

enum JobErrorCode {
  JOB_ERROR_CODE_UNSPECIFIED = 0;
  JOB_ERROR_CODE_AGENT_FAILED = 1;
  JOB_ERROR_CODE_NO_PLAN = 2;
  JOB_ERROR_CODE_SESSION_LOST = 3;
  JOB_ERROR_CODE_BRANCH_CONFLICT = 4;
  JOB_ERROR_CODE_PUSH_AUTH_FAILED = 5;
  JOB_ERROR_CODE_PUSH_FAILED = 6;
  JOB_ERROR_CODE_WORKSPACE_FAILED = 7;
  JOB_ERROR_CODE_JOB_CONFLICT = 8;
  JOB_ERROR_CODE_UNSUPPORTED = 9;
}
