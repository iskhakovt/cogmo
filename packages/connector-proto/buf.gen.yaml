version: v2
inputs:
  - directory: proto
clean: true
plugins:
  - local: protoc-gen-es
    out: src/gen
    opt:
      - target=ts
      - import_extension=js
      # Keeps the plugin version out of each file's header, so a plugin bump
      # fails CI's drift check only when it changes the generated code.
      - elide_plugin_version=true
