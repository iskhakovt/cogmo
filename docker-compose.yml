x-hindsight: &hindsight-base
  image: ghcr.io/vectorize-io/hindsight:latest
  ports:
    - "8888"
  healthcheck:
    test: ["CMD", "curl", "-sf", "http://localhost:8888/healthz"]
    interval: 5s
    timeout: 3s
    retries: 10
    start_period: 15s

services:
  postgres:
    image: pgvector/pgvector:pg18
    ports:
      - "5432"
    environment:
      POSTGRES_USER: assistant
      POSTGRES_DB: assistant
      POSTGRES_HOST_AUTH_METHOD: trust
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./scripts/init-db.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U assistant"]
      interval: 5s
      timeout: 3s
      retries: 5

  redis:
    image: redis:7-alpine
    ports:
      - "6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  inngest:
    image: inngest/inngest
    command: >
      inngest dev
      --host 0.0.0.0
      --port 8288
      --no-discovery
    ports:
      - "8288"
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:8288/health"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 15s

  hindsight:
    <<: *hindsight-base
    environment:
      HINDSIGHT_API_LLM_PROVIDER: ${HINDSIGHT_LLM_PROVIDER:-anthropic}
      HINDSIGHT_API_LLM_API_KEY: ${ANTHROPIC_API_KEY:-}
      HINDSIGHT_API_LLM_BASE_URL: ${HINDSIGHT_LLM_BASE_URL:-}

  # --- Test profile ---

  ollama:
    profiles: [test]
    image: ollama/ollama
    ports:
      - "11434"
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:11434/api/tags"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s

  hindsight-test:
    <<: *hindsight-base
    profiles: [test]
    environment:
      HINDSIGHT_API_LLM_PROVIDER: ollama
      HINDSIGHT_API_LLM_BASE_URL: http://ollama:11434
    depends_on:
      ollama:
        condition: service_healthy

  mock-anthropic:
    profiles: [test]
    build:
      context: ./test/mock-anthropic
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3000/health').then(r => process.exit(r.ok ? 0 : 1))"]
      interval: 3s
      timeout: 2s
      retries: 5

  assistant:
    profiles: [test]
    build:
      context: .
    environment:
      NODE_ENV: test
      DATABASE_URL: postgresql://assistant@postgres:5432/assistant
      ANTHROPIC_API_KEY: test-key
      ANTHROPIC_BASE_URL: http://mock-anthropic:3000
      HINDSIGHT_URL: http://hindsight-test:8888
      INNGEST_DEV: "true"
      INNGEST_BASE_URL: http://inngest:8288
    depends_on:
      postgres:
        condition: service_healthy
      inngest:
        condition: service_healthy
      mock-anthropic:
        condition: service_healthy
      hindsight-test:
        condition: service_healthy

volumes:
  pgdata:
  redisdata:
