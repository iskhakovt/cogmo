coverage:
  status:
    project:
      default:
        target: auto
        threshold: 1%
        informational: true
    patch:
      default:
        target: auto
        threshold: 1%
        informational: true

comment:
  layout: "reach, diff, flags, files"
  require_changes: true
  # Two CI jobs upload coverage under separate flags (`unit`,
  # `integration`). Without `after_n_builds`, Codecov posts the comment
  # as soon as the first flag arrives — patch% is then computed only
  # against that flag, which for unit-tested code shows up as ~6% under
  # the integration flag even when the file is 80%+ covered by unit
  # tests. Waiting for both uploads lets the comment reflect the union.
  after_n_builds: 2

flag_management:
  default_rules:
    carryforward: true
    statuses:
      - type: project
        target: auto
        threshold: 1%
        informational: true
      - type: patch
        target: auto
        threshold: 1%
        informational: true

# `**/`-prefixed so they match codecov's path-fixed report paths
# (`apps/server/src/...`) regardless of the workspace prefix it computes.
ignore:
  - "**/src/test/**"
  - "**/store/schema.ts"
  - "**/types.ts"
  - "**/inngest/events.ts"
  - "**/migrations/**"
  - "**/scripts/**"
  - "**/dev/**"
  - "**/test/**"
