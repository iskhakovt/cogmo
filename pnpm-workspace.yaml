packages:
  - "apps/*"
  - "packages/*"

injectWorkspacePackages: true

allowBuilds:
  cpu-features: false
  esbuild: false
  protobufjs: false
  ssh2: false

# Advisory floors for transitive deps nothing in the workspace pins, so
# Dependabot has no manifest entry to bump. Drop each once every parent's
# minimum range is patched.
#
# A floor also holds a security patch younger than Dependabot's `cooldown`,
# which the next version update would otherwise resolve below
# (.github/dependabot.yml); until it is 7 days old it also needs a
# `minimumReleaseAgeExclude` entry.
#
# Both bounds are load-bearing: unbounded, `fast-uri >=3.1.6` resolves to 4.1.4
# against ajv's `^3.0.1`, and a bare `<4.13.5` selector would drag a hono 3.x
# across a major. One major per entry — which does leave a sub-6 qs unpatched
# against GHSA-4mjr-xmp4-gh2g (spans >=2.2.5); none is in the tree, and one
# arriving wants investigating rather than a silent major bump.
overrides:
  "body-parser@>=2 <2.4.0": ">=2.4.0 <3" # GHSA-27r3-jxmh-p828 (high) via express
  "fast-uri@>=3 <3.1.6": ">=3.1.6 <4" # GHSA-5jgf-p345-68v8, -f65p-4m7j-42xc, -fph4-wmhf-6fwf, -jqff-g426-hqxp (high) via ajv
  "hono@>=4 <4.13.5": ">=4.13.5 <5" # GHSA-gqvv-2mrq-wpjv, -g6gw-c38x-mqfc, -crvj-82cr-hjcx (moderate) via @modelcontextprotocol/sdk, inngest
  "qs@>=6 <6.16.0": ">=6.16.0 <7" # GHSA-x5fp-wj9c-mxmx, GHSA-4mjr-xmp4-gh2g (moderate) via express, body-parser
  # Not a floor: @types/ssh2 alone asks for @types/node ^18. With that second
  # copy in the tree, a package taking any @types/node (`*`) binds to whichever
  # copy the resolver reuses, and Dependabot's re-resolution picks 18. One copy
  # leaves `*` one candidate. Move it with apps/server's @types/node.
  "@types/ssh2>@types/node": "^26.6.6"

# Every install, local and CI alike, takes only releases at least 7 days old,
# the soak Dependabot's `cooldown` waits out, and re-checks each lockfile entry
# against it. A release that has to land sooner is excluded by `name@version`;
# drop a temporary entry once its version is 7 days old.
minimumReleaseAge: 10080
minimumReleaseAgeExclude:
  # Standing: the Hindsight client is first-party (we contribute upstream and
  # pin the server to the matching image), so the soak that guards against
  # unknown third-party releases doesn't apply. Bump in lockstep with the
  # hindsight-api image pins in apps/server/dev/containers.ts and
  # cogmo.hindsightCompat.
  - '@vectorize-io/hindsight-client@1.1.0'
  - '@types/node@26.6.6' # until 2026-11-04

# Keeps pnpm-lock.yaml a single YAML document. Under the default `download`,
# pnpm 12 prepends an environment document recording itself, and GitHub's
# dependency graph reads only that first document, so Dependabot alerts see no
# dependencies (dependabot/dependabot-core#15904). The pnpm version is enforced
# from `packageManager` by corepack in the dev shell, pnpm/action-setup in CI,
# and a check before the image build's install.
pmOnFail: ignore
