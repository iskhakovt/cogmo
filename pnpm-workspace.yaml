packages:
  - "apps/*"
  - "packages/*"

injectWorkspacePackages: true

allowBuilds:
  cpu-features: false
  esbuild: false
  protobufjs: false
  ssh2: false

overrides:
  # @assistant-ui is a pre-1.0 line whose sibling peer ranges don't stay mutually
  # consistent: @assistant-ui/react@0.14.14 caps tap at ^0.5.14, but pnpm's
  # highest-in-range pick floats store to 0.2.14, which requires tap ^0.6.0 — and
  # the resulting store/tap mismatch breaks the web bundle (missing tap/react-shim).
  # Pin core+store to the batch that ships alongside the pinned @assistant-ui/react
  # (0.14.14 ↔ core 0.2.10 ↔ store 0.2.13, all needing tap ^0.5.14). Bump all three
  # in lockstep with @assistant-ui/react.
  "@assistant-ui/core": "0.2.10"
  "@assistant-ui/store": "0.2.13"

# The Hindsight client is a first-party dependency (we contribute upstream and
# pin the server to the matching image), so the supply-chain soak that guards
# against unknown third-party same-day releases doesn't apply — track its
# releases immediately. Bump in lockstep with the hindsight-api image pins in
# apps/server/dev/containers.ts and cogmo.hindsightCompat.
minimumReleaseAgeExclude:
  - '@vectorize-io/hindsight-client@0.8.1'
