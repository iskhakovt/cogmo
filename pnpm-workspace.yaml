packages:
  - "apps/*"
  - "packages/*"

injectWorkspacePackages: true

allowBuilds:
  cpu-features: false
  esbuild: false
  protobufjs: false
  ssh2: false

# Force patched versions of transitive deps carrying open security advisories.
# Each parent's declared range already admits the patched version — these floors
# stop a stale lockfile resolution from drifting back below it, since nothing in
# any manifest pins these packages and Dependabot only bumps manifest entries.
# Drop each once every parent's *minimum* supported range is patched.
overrides:
  # Capped below 4 because ajv declares fast-uri ^3.0.1 — an unbounded floor
  # would force a major the parent never declared support for.
  "fast-uri@<3.1.6": ">=3.1.6 <4" # GHSA-5jgf-p345-68v8, -f65p-4m7j-42xc, -fph4-wmhf-6fwf, -jqff-g426-hqxp (high) via ajv
  "hono@<4.13.5": ">=4.13.5" # GHSA-gqvv-2mrq-wpjv, -g6gw-c38x-mqfc, -crvj-82cr-hjcx (moderate) via @modelcontextprotocol/sdk, inngest
  "qs@<6.16.0": ">=6.16.0" # GHSA-x5fp-wj9c-mxmx, GHSA-4mjr-xmp4-gh2g (moderate) via express, body-parser

# The Hindsight client is a first-party dependency (we contribute upstream and
# pin the server to the matching image), so the supply-chain soak that guards
# against unknown third-party same-day releases doesn't apply — track its
# releases immediately. Bump in lockstep with the hindsight-api image pins in
# apps/server/dev/containers.ts and cogmo.hindsightCompat.
minimumReleaseAgeExclude:
  - '@vectorize-io/hindsight-client@0.9.1'
