# cogmo-skills-runtime — the python supervisor + runner that runs inside
# `cogmo-skills:<version>`. Hosts the JSON-RPC bridge to the Cogmo TS
# host (`src/skills/worker-sysbox/worker.ts`); workers spawn this via
# `python3 -u -m cogmo_skills_runtime`.
#
# Production has zero runtime deps (stdlib only). Dev group covers
# ruff/pyrefly/pytest for the local + CI workflow. uv-managed lockfile
# is the source of truth for what the image installs.

[project]
name = "cogmo-skills-runtime"
version = "0"
description = "Tier-2 skills runtime — fork-supervisor and one-shot skill runner"
readme = "README.md"
requires-python = ">=3.14"
dependencies = []

[dependency-groups]
dev = [
    "pyrefly>=0.61.0",
    "ruff>=0.14.0",
    "pytest>=9.0.0",
    "pytest-asyncio>=1.3.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.uv]
package = true
cache-keys = [{ file = "pyproject.toml" }]

[tool.hatch.build.targets.wheel]
packages = ["src/cogmo_skills_runtime"]

[tool.ruff]
include = ["pyproject.toml", "src/**/*.py", "tests/**/*.py"]
line-length = 120
target-version = "py314"

[tool.ruff.lint]
# F: pyflakes, E/W: pycodestyle, I: isort, B: bugbear, UP: pyupgrade,
# RUF: ruff-specific. Tight config — runtime is small enough that we can
# afford to fix every signal.
select = ["F", "E", "W", "I", "B", "UP", "RUF"]

[tool.pyrefly]
project-includes = ["src", "tests"]
search-path = ["src"]

[tool.pytest.ini_options]
addopts = "--import-mode=importlib"
pythonpath = ["src"]
asyncio_mode = "auto"
testpaths = ["tests"]
