version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: "chore(deps)"
    # Wait 7 days after a release before bumping. pnpm 11 enforces a 24h
    # minimumReleaseAge soak at install time, so Dependabot's default
    # (bump the instant a version is published) produces lockfiles that
    # fail `pnpm install --frozen-lockfile` whenever a release is fresh.
    # 7 days clears that gate with margin and gives a real soak window.
    # Applies to version-updates only — security updates are exempt.
    cooldown:
      default-days: 7
    # `@types/node` tracks the LOWEST Node major we support, not the newest:
    # the types say what the code may call, and the floor is what it runs on.
    # `engines` is `^24.15.0 || >=26.0.0`, so 24.x is right and 25 is excluded
    # outright, odd releases never becoming LTS. Nothing else catches a bump
    # past the floor — `@types/node` declares no `engines` for
    # `engine-ranges.test.ts` to check. Lift with the change that raises
    # `engines.node`.
    ignore:
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
    # Group updates so the lockfile only has one merge state to validate
    # at a time. Multiple overlapping PRs touching pnpm-lock.yaml can
    # produce a corrupted lockfile because GitHub's textual auto-rebase
    # runs on each merge in sequence and isn't lockfile-aware. Grouping
    # collapses that scenario into a single PR with one semantically-
    # resolved lockfile.
    #
    # Majors stay ungrouped — they deserve individual review.
    # Security and version updates can't share a group (Dependabot rule),
    # hence the security group.
    #
    # Family-specific groups precede the catch-alls so peer-dep-coupled
    # packages (OTel, Vitest, Drizzle, etc.) merge into a single PR even
    # when Dependabot's broad grouping splits them.
    groups:
      opentelemetry:
        applies-to: version-updates
        patterns: ["@opentelemetry/*"]
        update-types: ["minor", "patch"]
      vitest:
        applies-to: version-updates
        patterns: ["vitest", "@vitest/*"]
        update-types: ["minor", "patch"]
      drizzle:
        applies-to: version-updates
        patterns: ["drizzle-orm", "drizzle-kit"]
        update-types: ["minor", "patch"]
      inngest:
        applies-to: version-updates
        patterns: ["inngest", "@inngest/*"]
        update-types: ["minor", "patch"]
      octokit:
        applies-to: version-updates
        patterns: ["@octokit/*"]
        update-types: ["minor", "patch"]
      noble:
        applies-to: version-updates
        patterns: ["@noble/*"]
        update-types: ["minor", "patch"]
      types:
        applies-to: version-updates
        patterns: ["@types/*"]
        update-types: ["minor", "patch"]
      npm-patch:
        applies-to: version-updates
        patterns: ["*"]
        update-types: ["patch"]
      npm-minor:
        applies-to: version-updates
        patterns: ["*"]
        update-types: ["minor"]
      npm-security:
        applies-to: security-updates
        patterns: ["*"]
  - package-ecosystem: docker
    # The runtime image plus the two base images for the sandbox (devbase)
    # and skills (python) runtimes. Each holds its own digest-pinned FROM,
    # so all three need watching for base-image bumps.
    directories: ["/", "/images/devbase", "/images/skills"]
    schedule:
      interval: weekly
    commit-message:
      prefix: "chore(deps)"
    ignore:
      # Block Node major bumps. Dependabot has no LTS awareness and will
      # happily PR odd-numbered releases (which never become LTS), and
      # base-image majors tend to bring breaking changes (e.g. corepack
      # being removed from the distribution) that need human review.
      # Bump Node majors by hand once a year when the next even-numbered
      # LTS ships.
      # Glob because the name follows the image path: `library/node` for the
      # `mirror.gcr.io/library/...` spelling, bare `node` without it. Matching
      # both keeps the rule from going inert on a registry change.
      - dependency-name: "*node"
        update-types: ["version-update:semver-major"]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: "chore(deps)"
    groups:
      actions-minor-patch:
        applies-to: version-updates
        patterns: ["*"]
        update-types: ["minor", "patch"]
