version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: "chore(deps)"
    # Group updates so the lockfile only has one merge state to validate
    # at a time. Multiple overlapping PRs touching pnpm-lock.yaml can
    # produce a corrupted lockfile because GitHub's textual auto-rebase
    # runs on each merge in sequence and isn't lockfile-aware. Grouping
    # collapses that scenario into a single PR with one semantically-
    # resolved lockfile.
    #
    # Majors stay ungrouped — they deserve individual review.
    # Security and version updates can't share a group (Dependabot rule),
    # hence the security group.
    #
    # Family-specific groups precede the catch-alls so peer-dep-coupled
    # packages (OTel, Vitest, Drizzle, etc.) merge into a single PR even
    # when Dependabot's broad grouping splits them.
    groups:
      opentelemetry:
        applies-to: version-updates
        patterns: ["@opentelemetry/*"]
        update-types: ["minor", "patch"]
      vitest:
        applies-to: version-updates
        patterns: ["vitest", "@vitest/*"]
        update-types: ["minor", "patch"]
      drizzle:
        applies-to: version-updates
        patterns: ["drizzle-orm", "drizzle-kit"]
        update-types: ["minor", "patch"]
      inngest:
        applies-to: version-updates
        patterns: ["inngest", "@inngest/*"]
        update-types: ["minor", "patch"]
      octokit:
        applies-to: version-updates
        patterns: ["@octokit/*"]
        update-types: ["minor", "patch"]
      noble:
        applies-to: version-updates
        patterns: ["@noble/*"]
        update-types: ["minor", "patch"]
      types:
        applies-to: version-updates
        patterns: ["@types/*"]
        update-types: ["minor", "patch"]
      npm-patch:
        applies-to: version-updates
        patterns: ["*"]
        update-types: ["patch"]
      npm-minor:
        applies-to: version-updates
        patterns: ["*"]
        update-types: ["minor"]
      npm-security:
        applies-to: security-updates
        patterns: ["*"]
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: "chore(deps)"
    ignore:
      # Block Node major bumps. Dependabot has no LTS awareness and will
      # happily PR odd-numbered releases (which never become LTS), and
      # base-image majors tend to bring breaking changes (e.g. corepack
      # being removed from the distribution) that need human review.
      # Bump Node majors by hand once a year when the next even-numbered
      # LTS ships.
      - dependency-name: node
        update-types: ["version-update:semver-major"]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: "chore(deps)"
    groups:
      actions-minor-patch:
        applies-to: version-updates
        patterns: ["*"]
        update-types: ["minor", "patch"]
