name: Sysbox E2E

# Sysbox-runtime e2e — installs sysbox 0.7.0 on a fresh ubuntu-24.04 runner
# and runs the supervisor's sysbox-flavoured tests. Path-filtered so it only
# fires on changes that could plausibly affect the sandbox supervisor or its
# Docker-API integration.

on:
  push:
    branches: [main]
    paths:
      - "src/sandbox/**"
      - "src/agent/coding/**"
      - "src/skills/**"
      - "images/skills/**"
      - "docker-bake.hcl"
      - ".github/workflows/sysbox-e2e.yml"
      - "package.json"
      - "pnpm-lock.yaml"
  pull_request:
    paths:
      - "src/sandbox/**"
      - "src/agent/coding/**"
      - "src/skills/**"
      - "images/skills/**"
      - "docker-bake.hcl"
      - ".github/workflows/sysbox-e2e.yml"
      - "package.json"
      - "pnpm-lock.yaml"
  workflow_dispatch:

concurrency:
  group: sysbox-e2e-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions: {}

jobs:
  sysbox:
    name: Sysbox supervisor tests
    # Pinned to ubuntu-24.04 — sysbox 0.7.0's .deb only supports up to Noble
    # (kernel 6.8+). Ubuntu-26.04 bump is tracked in todo.md once both
    # actions/runner-images and sysbox catch up.
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      checks: write
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Verify host meets sysbox kernel requirements
        run: |
          set -euo pipefail
          uname -a
          # Sysbox needs cgroupv2; GHA's ubuntu-24.04 runners default to it.
          # `cgroup.controllers` is a file (the list of available controllers),
          # not a directory — `-f` is the right test.
          mount | grep -E "^cgroup" || true
          if [ -f /sys/fs/cgroup/cgroup.controllers ]; then
            echo "cgroup v2: OK"
          else
            echo "cgroup v2 missing — sysbox install will likely fail" >&2
            exit 1
          fi

      - name: Install sysbox-ce 0.7.0
        run: |
          set -euo pipefail
          # Sysbox install needs Docker stopped to register the runtime
          # cleanly. The .deb's postinst handles dockerd config + restart.
          curl -fsSL https://downloads.nestybox.com/sysbox/releases/v0.7.0/sysbox-ce_0.7.0-0.linux_amd64.deb \
            -o /tmp/sysbox.deb
          # SHA256 pin — equivalent to the commit-SHA pinning we apply to
          # GHA actions. Bumping sysbox = bump version in URL + recompute.
          echo "eeff273671467b8fa351ab3d40709759462dc03d9f7b50a1b207b37982ce40a9 /tmp/sysbox.deb" \
            | sha256sum -c -
          sudo apt-get install -y /tmp/sysbox.deb
          sudo systemctl is-active sysbox || (sudo journalctl -u sysbox --no-pager -n 100 && exit 1)
          docker info --format '{{json .Runtimes}}' | grep -q sysbox-runc || (
            docker info && echo "sysbox-runc not registered" && exit 1
          )

      - uses: pnpm/action-setup@8912a9102ac27614460f54aedde9e1e7f9aec20d # v6.0.5
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      - name: Log into Docker Hub
        if: env.DOCKERHUB_USERNAME != ''
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
        uses: docker/login-action@4907a6ddec9925e35a0a9e82d7399ccc52663121 # v4.1.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - uses: docker/setup-buildx-action@4d04d5d9486b7bd6fa91e7baf45bbb4f8b9deedd # v4.0.0

      # Bake `cogmo-skills` into the local daemon so the integration test runs
      # against the artifact this commit would produce — not against
      # `python:3.14-slim` from Docker Hub. `--load` keeps it unpushed (no
      # registry pollution); `cache-from: type=gha,scope=skills` shares the
      # cache populated by `skills.yml` on main, so steady-state cost is
      # roughly a `docker pull`. Tag overridden to `:slice1` so it matches
      # the production image the env var points at.
      - name: Build cogmo-skills (load locally for tests)
        uses: docker/bake-action@a66e1c87e2eca0503c343edf1d208c716d54b8a8 # v7.1.0
        env:
          # Disable provenance + SBOM attestations — they produce extra
          # entries in an OCI manifest list, which `--load` can't import.
          # Production builds (skills.yml, devbase.yml, publish.yml) leave
          # WITH_ATTEST at its default and ship full attestations.
          WITH_ATTEST: "false"
        with:
          source: .
          files: ./docker-bake.hcl
          targets: skills
          load: true
          set: |
            skills.tags=ghcr.io/iskhakovt/cogmo-skills:slice1
            skills.cache-from=type=gha,scope=skills

      - name: Run sysbox-flavoured supervisor + skills tests
        env:
          SANDBOX_RUNTIME: sysbox
          TESTCONTAINERS_RYUK_DISABLED: "true"
        run: |
          pnpm test:integration \
            src/sandbox/supervisor.sysbox.integration.test.ts \
            src/skills/runner.sysbox.integration.test.ts

      - uses: dorny/test-reporter@a43b3a5f7366b97d083190328d2c652e1a8b6aa2 # v3.0.0
        if: always()
        with:
          name: Sysbox E2E Test Results
          path: test-results/junit.xml
          reporter: java-junit
