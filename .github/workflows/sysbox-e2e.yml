name: Sysbox E2E

# Sysbox-runtime e2e — installs sysbox 0.7.1 on a fresh ubuntu-24.04 runner
# and runs the supervisor's sysbox-flavoured tests. Path-filtered so it only
# fires on changes that could plausibly affect the sandbox supervisor or its
# Docker-API integration.

on:
  push:
    branches: [main]
    paths:
      - "apps/server/src/sandbox/**"
      - "apps/server/src/agent/coding/**"
      - "apps/server/src/skills/**"
      - "images/skills/**"
      - "images/devbase/**"
      - "docker-bake.hcl"
      - ".github/workflows/sysbox-e2e.yml"
      - "package.json"
      - "pnpm-lock.yaml"
  pull_request:
    paths:
      - "apps/server/src/sandbox/**"
      - "apps/server/src/agent/coding/**"
      - "apps/server/src/skills/**"
      - "images/skills/**"
      - "images/devbase/**"
      - "docker-bake.hcl"
      - ".github/workflows/sysbox-e2e.yml"
      - "package.json"
      - "pnpm-lock.yaml"
  workflow_dispatch:

# Note: paths include `images/skills/**`, `images/devbase/**`, and
# `docker-bake.hcl` because the bake step builds both the skills image and
# the devbase image as part of the test setup — a Dockerfile-only bump
# still needs this job to verify the new image runs end-to-end.

concurrency:
  group: sysbox-e2e-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions: {}

jobs:
  sysbox:
    name: Sysbox supervisor tests
    # Pinned to ubuntu-24.04 — sysbox 0.7.1's .deb only supports up to Noble
    # (kernel 6.8+). Ubuntu-26.04 bump is tracked in todo.md once both
    # actions/runner-images and sysbox catch up.
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      checks: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Verify host meets sysbox kernel requirements
        run: |
          set -euo pipefail
          uname -a
          # Sysbox needs cgroupv2; GHA's ubuntu-24.04 runners default to it.
          # `cgroup.controllers` is a file (the list of available controllers),
          # not a directory — `-f` is the right test.
          mount | grep -E "^cgroup" || true
          if [ -f /sys/fs/cgroup/cgroup.controllers ]; then
            echo "cgroup v2: OK"
          else
            echo "cgroup v2 missing — sysbox install will likely fail" >&2
            exit 1
          fi

      - name: Install sysbox-ce 0.7.1
        run: ./.github/scripts/install-sysbox.sh

      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      - name: Log into Docker Hub
        if: env.DOCKERHUB_USERNAME != ''
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      # Bake `cogmo-skills` AND `cogmo-devbase` into the local daemon so
      # the integration tests run against the artifacts this commit would
      # produce — not against `python:3.14-slim` from Docker Hub
      # (skills) or whatever Claude Code CLI version is on the developer's
      # PATH (devbase). `--load` keeps them unpushed (no registry
      # pollution); `cache-from` shares the GHA cache populated by
      # `publish.yml` on release, so steady-state cost is roughly a
      # `docker pull`. `VERSION=test` tags the images as
      # `cogmo-skills:test` and `cogmo-devbase:test` (matched by the
      # integration tests' image constants).
      - name: Build cogmo-skills + cogmo-devbase (load locally for tests)
        uses: docker/bake-action@d3418bd7d0e9324001bca92fa8ba175ea7e6dc9b # v7.3.0
        env:
          VERSION: test
        with:
          source: .
          files: ./docker-bake.hcl
          targets: skills,devbase
          load: true

      - name: Run sysbox-flavoured supervisor + skills + coding-CLI tests
        env:
          SANDBOX_RUNTIME: sysbox
          TESTCONTAINERS_RYUK_DISABLED: "true"
        run: |
          pnpm test:integration \
            src/sandbox/supervisor.sysbox.integration.test.ts \
            src/skills/runner.sysbox.integration.test.ts \
            src/agent/coding/claude-cli.integration.test.ts

      - uses: dorny/test-reporter@a43b3a5f7366b97d083190328d2c652e1a8b6aa2 # v3.0.0
        if: always()
        with:
          name: Sysbox E2E Test Results
          path: apps/server/test-results/junit.xml
          reporter: java-junit
