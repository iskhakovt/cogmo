name: Release

# Manual-only. Trigger via Actions UI ("Run workflow") or `gh workflow run
# release.yml --ref main`. CI on main is the source of truth for "main is
# shippable" — this workflow refuses to proceed unless every check on the
# current main HEAD is green (success / skipped / neutral). Use the
# `skip_ci_check` input to bypass when an external check is stuck and
# the operator has independently verified main is shippable.
on:
  workflow_dispatch:
    inputs:
      skip_ci_check:
        description: "Skip the gate that requires CI green on main HEAD. Use only when an external check is stuck."
        type: boolean
        default: false

permissions: {}

# One release at a time across the entire repo. Two operators clicking
# "Run workflow" simultaneously would each try to push the same tag.
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    name: Release
    if: github.ref == 'refs/heads/main' && github.repository == 'iskhakovt/cogmo'
    runs-on: ubuntu-latest
    # Covers the 5-min wait-for-status-checks step + ~1 min of semantic-release
    # work + buffer. The Environment-approval pause does not count against
    # `timeout-minutes` (it's pre-job, not in-job).
    timeout-minutes: 10
    # Approval gate: GitHub pauses this job until the required reviewer
    # (configured in Settings → Environments → production) clicks Approve.
    # Matches the pattern Anthropic's TS SDK uses on `publish-npm.yml`.
    # Publish runs after Release on the same dispatch — one approval covers
    # both, no second gate.
    environment: production
    permissions:
      contents: write
      issues: write
      pull-requests: write
    outputs:
      new_release_published: ${{ steps.semantic.outputs.published }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
      # Polls check runs on this SHA. Defaults exclude the current job
      # (this `release` job's own check), so the only filter we add is
      # `^codecov/` for the informational checks marked non-blocking in
      # `.codecov.yml` per 16cb72f. Treats `success` / `skipped` /
      # `neutral` as pass. Short `timeout` keeps runner-billing minimal —
      # covers "I clicked dispatch while CI was finishing" without
      # burning a full CI cycle's worth of polling time. If you click
      # dispatch with CI nowhere near done, the action fails after 5 min
      # and you re-click once CI completes.
      - name: Wait for CI green on main HEAD
        if: ${{ !inputs.skip_ci_check }}
        uses: poseidon/wait-for-status-checks@899c768d191b56eef585c18f8558da19e1f3e707 # v0.6.0
        with:
          token: ${{ github.token }}
          ignore_pattern: ^codecov/
          interval: 30
          timeout: 300
      - name: Skipped CI gate (operator override)
        if: ${{ inputs.skip_ci_check }}
        run: echo "::warning::skip_ci_check=true — releasing without verifying CI status on main HEAD"
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 24
      - id: semantic
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          npx --yes \
            -p semantic-release@25.0.3 \
            -p @semantic-release/commit-analyzer@13.0.1 \
            -p @semantic-release/release-notes-generator@14.1.0 \
            -p @semantic-release/github@12.0.6 \
            semantic-release
          if git describe --exact-match --tags HEAD >/dev/null 2>&1; then
            echo "published=true" >> "$GITHUB_OUTPUT"
          fi

  publish:
    name: Publish Image
    # `needs:` is required even though `if:` references the same job:
    # without it the outputs context is empty and `if:` silently false.
    needs: [release]
    if: needs.release.outputs.new_release_published == 'true'
    uses: ./.github/workflows/publish.yml
    # Keep in sync with the docker job in publish.yml.
    permissions:
      contents: read
      packages: write
