name: Skills Image

on:
  push:
    branches: [main]
    paths:
      - "images/skills/**"
      - "docker-bake.hcl"
      - ".github/workflows/skills.yml"
  pull_request:
    paths:
      - "images/skills/**"
      - "docker-bake.hcl"
      - ".github/workflows/skills.yml"
  workflow_dispatch:

concurrency:
  group: skills-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

# Deny-by-default; the build job grants what it needs.
permissions: {}

jobs:
  build:
    name: Build & Push
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      # Logging in only matters when we'll push (push-to-main, or
      # workflow_dispatch from main). Anything else — PR builds, dispatches
      # from feature branches — is verification-only and skips the push.
      - if: github.ref == 'refs/heads/main'
        uses: docker/login-action@4907a6ddec9925e35a0a9e82d7399ccc52663121 # v4.1.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/metadata-action@030e881283bb7a6894de51c315a6bfe6a94e05cf # v6.0.0
        id: meta
        with:
          images: ghcr.io/${{ github.repository }}-skills
          # Slice tag is the durable handle the runner pins via
          # COGMO_SKILLS_IMAGE; sha tags exist for rollback to a specific
          # build of that slice.
          tags: |
            type=raw,value=slice1
            type=sha,prefix=slice1-,format=short
          bake-target: docker-metadata-action

      - uses: docker/setup-buildx-action@4d04d5d9486b7bd6fa91e7baf45bbb4f8b9deedd # v4.0.0

      - uses: docker/bake-action@a66e1c87e2eca0503c343edf1d208c716d54b8a8 # v7.1.0
        with:
          source: .
          files: |
            ./docker-bake.hcl
            cwd://${{ steps.meta.outputs.bake-file }}
          targets: skills
          # Only push when running from main — `event != 'pull_request'`
          # alone would also push on a `workflow_dispatch` run started from
          # a feature branch, overwriting the stable `slice1` tag with
          # unmerged code.
          push: ${{ github.ref == 'refs/heads/main' }}
