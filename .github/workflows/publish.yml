name: Publish

on:
  # Invoked from ci.yml's `publish` job after semantic-release cuts a
  # new version. Tag-push triggers don't work here because semantic-release
  # uses GITHUB_TOKEN to create the tag, and GITHUB_TOKEN-created events
  # do not trigger downstream workflows. workflow_call runs in the same
  # workflow run as the caller, so the limitation doesn't apply.
  workflow_call:
  # Manual backfill against any ref via the GitHub UI — pick a tag in
  # the ref dropdown and dunamai derives the version from there.
  workflow_dispatch:

jobs:
  docker:
    name: Build & Push Image
    runs-on: ubuntu-latest
    # Don't cancel in-flight publishes — let an active build finish even
    # if a newer CI run starts. Atomicity over iteration speed: cancelling
    # mid-push leaves a tagged release with no image (the exact failure
    # mode this PR fixes). Group is static so the constraint applies
    # across both workflow_call entry points (CI release) and manual
    # workflow_dispatch invocations.
    concurrency:
      group: publish-image
      cancel-in-progress: false
    # Kept in sync with the calling job in ci.yml — there is no
    # `permissions: inherit` for reusable workflows. The caller's
    # permissions are a ceiling and the callee declares its request;
    # the effective set is the intersection. Both blocks must match
    # (or this one must be a strict subset of the caller's).
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - uses: mtkennerly/dunamai-action@v1
        id: version
        with:
          args: --style semver

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/metadata-action@v6
        id: meta
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=${{ steps.version.outputs.version }}

      - uses: docker/setup-buildx-action@v3

      - uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # WARNING: do NOT add secrets to build-args — `provenance: true`
          # below uses mode=max which embeds the build-args list into the
          # SLSA provenance attestation forever. Use BuildKit secrets
          # (--mount=type=secret) for anything sensitive.
          build-args: VERSION=${{ steps.version.outputs.version }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          # SLSA build provenance: in-manifest metadata describing how
          # this image was built (source repo, commit SHA, builder
          # identity, workflow run). Stored as a separate OCI manifest
          # linked to the image. UNSIGNED — verifiable by content but
          # not cryptographically attested to a workflow identity.
          provenance: true
          # Software Bill of Materials: in-manifest SPDX inventory of
          # every package inside the image. Used by container vuln
          # scanners and supply-chain auditors. Also unsigned.
          sbom: true

      # TODO: when the repo goes public, add signed attestations via
      # `actions/attest-build-provenance` and `actions/attest-sbom`. They
      # use the GitHub Actions OIDC token + Sigstore Fulcio + Rekor to
      # produce DSSE-signed attestations bound to the workflow identity,
      # verifiable via `gh attestation verify oci://...`. Requires
      # `id-token: write` and `attestations: write` permissions added to
      # both the calling job in ci.yml AND the docker job here. Currently
      # gated on the repo being public — `actions/attest-build-provenance`
      # only supports private repos on GitHub Enterprise Cloud, not on
      # Free/Pro/Team plans, so signing on a private repo would silently
      # no-op or fail. See:
      #   https://github.com/actions/attest-build-provenance
      #   https://docs.github.com/en/actions/security-for-github-actions/using-artifact-attestations/using-artifact-attestations-to-establish-provenance-for-builds
