name: Publish

# Release-time build of all three Cogmo-owned container images at the same
# semver. Called from `release.yml` after semantic-release cuts a new git
# tag, so `dunamai` resolves to a clean `MAJOR.MINOR.PATCH` here.
#
# Multi-arch strategy: cogmo runs on a per-platform matrix on native
# runners (no QEMU emulation). Each matrix run pushes its image by digest
# only — no tag yet. The `merge-cogmo` job then combines the per-platform
# digests into a single multi-arch manifest under the release tag via
# `docker buildx imagetools create`. devbase + skills are amd64-only
# (sysbox amd64-only), so they build on a single runner with normal
# bake + push.
#
# `merge-cogmo` waits on BOTH `cogmo` and `base-images` so a partial
# publish (cogmo tagged but devbase/skills missing) can't happen. The
# runtime cogmo image references `cogmo-devbase:VERSION` and
# `cogmo-skills:VERSION` for sandboxed work — atomicity matters more than
# the few-second-on-the-critical-path tax of waiting for base-images.
#
# Cache scopes per platform (`cogmo-amd64`, `cogmo-arm64`) avoid
# moby/buildkit#2758, where a single buildx invocation building two
# platforms into one scope has the second platform's manifest overwrite
# the first.

on:
  workflow_call:
  workflow_dispatch:

# One publish flow at a time across the entire repo. Two simultaneous
# `workflow_dispatch` invocations would race on the same release tags
# and on the same per-platform digest artifacts.
concurrency:
  group: publish-images
  cancel-in-progress: false

permissions: {}

jobs:
  # Resolve the release version once and fan out to every build job so
  # they all see the same string. dunamai inside each job worked today
  # because release.yml pushes the tag before invoking publish.yml — but
  # any future flow that dispatches publish.yml against an untagged
  # commit would otherwise hand each job its own dev version.
  setup:
    name: Resolve version
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    permissions:
      contents: read
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
      - id: version
        run: |
          set -euo pipefail
          version=$(pipx run dunamai==1.26.1 from any --style semver)
          echo "Resolved version: $version"
          echo "version=$version" >> "$GITHUB_OUTPUT"

  cogmo:
    name: Build cogmo (${{ matrix.slug }})
    needs: [setup]
    strategy:
      fail-fast: true
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-24.04
            slug: amd64
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
            slug: arm64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 25
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0

      - uses: docker/login-action@4907a6ddec9925e35a0a9e82d7399ccc52663121 # v4.1.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/setup-buildx-action@4d04d5d9486b7bd6fa91e7baf45bbb4f8b9deedd # v4.0.0

      # Per-platform: override platforms + cache scope to the matrix arch
      # and push by digest only — the merge job applies tags afterwards.
      # `cogmo.tags=` clears the tag inherited from cogmo-meta:
      # push-by-digest mode rejects any tagged ref ("can't push tagged ref
      # ... by digest"), and the merge job is the one that applies the
      # final semver + latest tags via `imagetools create`.
      - uses: docker/bake-action@a66e1c87e2eca0503c343edf1d208c716d54b8a8 # v7.1.0
        id: bake
        env:
          VERSION: ${{ needs.setup.outputs.version }}
        with:
          source: .
          files: |
            ./docker-bake.hcl
          targets: cogmo
          set: |
            cogmo.platform=${{ matrix.platform }}
            cogmo.tags=
            cogmo.cache-from=type=gha,scope=cogmo-${{ matrix.slug }}
            cogmo.cache-to=type=gha,scope=cogmo-${{ matrix.slug }},mode=max
            cogmo.output=type=image,name=ghcr.io/${{ github.repository }},push-by-digest=true,name-canonical=true,push=true

      - name: Export digest
        run: |
          mkdir -p /tmp/digests
          digest="${{ fromJSON(steps.bake.outputs.metadata).cogmo['containerimage.digest'] }}"
          touch "/tmp/digests/${digest#sha256:}"

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: cogmo-digest-${{ matrix.slug }}
          path: /tmp/digests/*
          if-no-files-found: error
          retention-days: 1

  base-images:
    name: Build devbase + skills
    needs: [setup]
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0

      - uses: docker/login-action@4907a6ddec9925e35a0a9e82d7399ccc52663121 # v4.1.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/metadata-action@030e881283bb7a6894de51c315a6bfe6a94e05cf # v6.0.0
        id: meta-devbase
        with:
          images: ghcr.io/${{ github.repository }}-devbase
          tags: |
            type=raw,value=${{ needs.setup.outputs.version }}
            type=raw,value=latest
          bake-target: devbase-meta

      - uses: docker/metadata-action@030e881283bb7a6894de51c315a6bfe6a94e05cf # v6.0.0
        id: meta-skills
        with:
          images: ghcr.io/${{ github.repository }}-skills
          tags: |
            type=raw,value=${{ needs.setup.outputs.version }}
            type=raw,value=latest
          bake-target: skills-meta

      - uses: docker/setup-buildx-action@4d04d5d9486b7bd6fa91e7baf45bbb4f8b9deedd # v4.0.0

      # VERSION env passed for symmetry with the cogmo job + defense-in-depth.
      # metadata-action's bake-files override the in-file `*-meta` fallback
      # tags at runtime, so this is belt-and-suspenders against a future
      # path where metadata-action's output isn't wired.
      - uses: docker/bake-action@a66e1c87e2eca0503c343edf1d208c716d54b8a8 # v7.1.0
        env:
          VERSION: ${{ needs.setup.outputs.version }}
        with:
          source: .
          files: |
            ./docker-bake.hcl
            cwd://${{ steps.meta-devbase.outputs.bake-file }}
            cwd://${{ steps.meta-skills.outputs.bake-file }}
          targets: devbase,skills
          push: true

  merge-cogmo:
    name: Merge cogmo multi-arch manifest
    # Wait on base-images too — see workflow header for the atomicity rationale.
    needs: [setup, cogmo, base-images]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      packages: write
    steps:
      - uses: docker/login-action@4907a6ddec9925e35a0a9e82d7399ccc52663121 # v4.1.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: /tmp/digests
          pattern: cogmo-digest-*
          merge-multiple: true

      - uses: docker/metadata-action@030e881283bb7a6894de51c315a6bfe6a94e05cf # v6.0.0
        id: meta
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=${{ needs.setup.outputs.version }}
            type=raw,value=latest

      - uses: docker/setup-buildx-action@4d04d5d9486b7bd6fa91e7baf45bbb4f8b9deedd # v4.0.0

      - name: Create multi-arch manifest
        working-directory: /tmp/digests
        env:
          DOCKER_METADATA_OUTPUT_JSON: ${{ steps.meta.outputs.json }}
        run: |
          set -euo pipefail
          docker buildx imagetools create \
            $(jq -cr '.tags | map("-t " + .) | join(" ")' <<< "$DOCKER_METADATA_OUTPUT_JSON") \
            $(printf 'ghcr.io/${{ github.repository }}@sha256:%s ' *)

      - name: Inspect multi-arch image
        run: |
          docker buildx imagetools inspect ghcr.io/${{ github.repository }}:${{ needs.setup.outputs.version }}

  # Vulnerability scan against the released images. Runs once all three are
  # tagged at this version. Results upload to GitHub code-scanning (Security
  # tab) — findings don't block the release. Triage happens async; an acute
  # CVE drives a patch release rather than gating publish behind it.
  #
  # Trivy scans the runner's native arch (amd64). The other arch shares the
  # same Dockerfile + OS package set, so amd64 findings are a faithful proxy
  # for the manifest list as a whole.
  scan:
    name: Trivy scan (${{ matrix.image }})
    needs: [setup, merge-cogmo, base-images]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      packages: read
      # Upload SARIF to code-scanning. Without this, the action fails with
      # "Resource not accessible by integration" on the upload step.
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        image: [cogmo, cogmo-devbase, cogmo-skills]
    steps:
      - uses: docker/login-action@4907a6ddec9925e35a0a9e82d7399ccc52663121 # v4.1.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          # ghcr.io/iskhakovt/cogmo[-devbase|-skills]:VERSION. github.repository
          # is `iskhakovt/cogmo`; the matrix value substitutes the package
          # name component.
          image-ref: ghcr.io/${{ github.repository_owner }}/${{ matrix.image }}:${{ needs.setup.outputs.version }}
          format: sarif
          output: trivy-results.sarif
          # Surface only actionable findings — unfixed CVEs can't be patched
          # by us today, and lower severities create triage noise that
          # crowds out real signal.
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          vuln-type: os,library
          # `exit-code: 0` (default) — see job header for the don't-block
          # rationale. Findings surface via the Security tab.

      - uses: github/codeql-action/upload-sarif@458d36d7d4f47d0dd16ca424c1d3cda0060f1360 # v3.35.5
        # Run even if Trivy itself errored (e.g. DB download flake) so we
        # don't lose partial results. The upload action no-ops on a missing
        # file but logs a clear message.
        if: always()
        with:
          sarif_file: trivy-results.sarif
          # Distinct category per image so the Security tab keeps them
          # separated instead of overwriting each other on subsequent
          # uploads.
          category: trivy-${{ matrix.image }}
