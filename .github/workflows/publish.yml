name: Publish

on:
  # Invoked from ci.yml's `publish` job after semantic-release cuts a
  # new version. Tag-push triggers don't work here because semantic-release
  # uses GITHUB_TOKEN to create the tag, and GITHUB_TOKEN-created events
  # do not trigger downstream workflows. workflow_call runs in the same
  # workflow run as the caller, so the limitation doesn't apply.
  workflow_call:
  # Manual backfill against any ref via the GitHub UI — pick a tag in
  # the ref dropdown and dunamai derives the version from there.
  workflow_dispatch:

jobs:
  docker:
    name: Build & Push Image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - uses: mtkennerly/dunamai-action@v1
        id: version
        with:
          args: --style semver

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/metadata-action@v6
        id: meta
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=${{ steps.version.outputs.version }}

      - uses: docker/setup-buildx-action@v3

      - uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: VERSION=${{ steps.version.outputs.version }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          # SLSA build provenance: signed metadata describing how this
          # image was built (source repo, commit SHA, builder identity,
          # workflow run). Verifiable via cosign / slsa-verifier.
          provenance: true
          # Software Bill of Materials: machine-readable inventory of
          # every package inside the image. Used by container vuln
          # scanners and supply-chain auditors. Format: SPDX.
          sbom: true
