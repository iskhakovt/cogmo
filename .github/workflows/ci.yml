name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

# Deny-by-default; each job grants what it needs.
permissions: {}

jobs:
  pr-title:
    name: PR Title
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Validate Conventional Commits format
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: |
          set -euo pipefail
          echo "$PR_TITLE" | npx --yes \
            -p @commitlint/cli@20.5.0 \
            -p @commitlint/config-conventional@20.5.0 \
            commitlint

  check:
    name: Typecheck & Lint
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: pnpm/action-setup@8912a9102ac27614460f54aedde9e1e7f9aec20d # v6.0.5
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm lint

  skills-runtime:
    name: Skills Runtime (Python)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      checks: write
    defaults:
      run:
        working-directory: images/skills
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Install uv
        uses: astral-sh/setup-uv@bd01e18f51369d5a26f1651c3cb451d3417e3bba # v7.0.0
        with:
          # Match the version pinned in images/skills/Dockerfile so a CI
          # green doesn't drift from what the published image uses.
          version: "0.11.12"
          enable-cache: true
          cache-dependency-glob: "images/skills/uv.lock"
      - run: uv sync --locked
      - name: ruff (lint + format)
        run: uv run ruff check
      - name: pyrefly (typecheck)
        run: uv run pyrefly check
      - name: pytest
        run: uv run pytest

  unit:
    name: Unit Tests
    runs-on: ubuntu-latest
    permissions:
      contents: read
      checks: write
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: pnpm/action-setup@8912a9102ac27614460f54aedde9e1e7f9aec20d # v6.0.5
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm test --coverage --coverage.reportsDirectory=coverage/unit
      - uses: codecov/codecov-action@57e3a136b779b570ffcdbf80b3bdc90e7fab3de2 # v6.0.0
        if: always()
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          flags: unit
          files: coverage/unit/lcov.info
      - uses: dorny/test-reporter@a43b3a5f7366b97d083190328d2c652e1a8b6aa2 # v3.0.0
        if: always()
        with:
          name: Unit Test Results
          path: test-results/junit.xml
          reporter: java-junit

  integration:
    name: Integration Tests
    runs-on: ubuntu-latest
    permissions:
      contents: read
      checks: write
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: pnpm/action-setup@8912a9102ac27614460f54aedde9e1e7f9aec20d # v6.0.5
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Log into Docker Hub
        if: env.DOCKERHUB_USERNAME != ''
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
        uses: docker/login-action@4907a6ddec9925e35a0a9e82d7399ccc52663121 # v4.1.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - run: pnpm test:integration --coverage --coverage.reportsDirectory=coverage/integration
        env:
          TESTCONTAINERS_RYUK_DISABLED: "true"
      - uses: codecov/codecov-action@57e3a136b779b570ffcdbf80b3bdc90e7fab3de2 # v6.0.0
        if: always()
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          flags: integration
          files: coverage/integration/lcov.info
      - uses: dorny/test-reporter@a43b3a5f7366b97d083190328d2c652e1a8b6aa2 # v3.0.0
        if: always()
        with:
          name: Integration Test Results
          path: test-results/junit.xml
          reporter: java-junit

  e2e:
    name: E2E Tests
    runs-on: ubuntu-latest
    permissions:
      contents: read
      checks: write
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: docker/setup-buildx-action@4d04d5d9486b7bd6fa91e7baf45bbb4f8b9deedd # v4.0.0

      # Build the cogmo app image via bake (same target + Dockerfile as
      # publish.yml) so e2e and publish share the GHA cache scope. Override
      # to amd64-only with a matching cache scope — multi-arch is for
      # release artifacts, not test verification, and an amd64-only build
      # writing to the arm64 scope would degrade the next release's arm64
      # cache hits (moby/buildkit#2758). `WITH_ATTEST=false` because
      # `--load` can't import the manifest list that attestations produce.
      # Tag overridden to `cogmo:ci` to match `E2E_IMAGE` below.
      - uses: docker/bake-action@a66e1c87e2eca0503c343edf1d208c716d54b8a8 # v7.1.0
        env:
          WITH_ATTEST: "false"
        with:
          source: .
          files: ./docker-bake.hcl
          targets: cogmo
          load: true
          set: |
            cogmo.tags=cogmo:ci
            cogmo.platform=linux/amd64
            cogmo.cache-from=type=gha,scope=cogmo-amd64
            cogmo.cache-to=type=gha,scope=cogmo-amd64,mode=max
      - uses: pnpm/action-setup@8912a9102ac27614460f54aedde9e1e7f9aec20d # v6.0.5
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Log into Docker Hub
        if: env.DOCKERHUB_USERNAME != ''
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
        uses: docker/login-action@4907a6ddec9925e35a0a9e82d7399ccc52663121 # v4.1.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - run: pnpm test:e2e
        env:
          E2E_IMAGE: cogmo:ci
          TESTCONTAINERS_RYUK_DISABLED: "true"
      - uses: dorny/test-reporter@a43b3a5f7366b97d083190328d2c652e1a8b6aa2 # v3.0.0
        if: always()
        with:
          name: E2E Test Results
          path: test-results/junit.xml
          reporter: java-junit

# Release + publish live in `release.yml` and run on `workflow_dispatch`
# only. Trigger via Actions UI or `gh workflow run release.yml --ref main`.
# CI on main remains the source of truth for "main is shippable" — the
# release workflow gates on it and pauses on a `production` Environment
# approval.
