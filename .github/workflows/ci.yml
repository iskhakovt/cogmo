name: CI

on:
  push:
    branches: [main]
  pull_request:
    # `labeled` lets adding the `e2e` label retrigger the workflow without
    # forcing a no-op commit — the e2e job's gate then evaluates true on
    # the next run. `unlabeled` is intentionally absent: removing a label
    # shouldn't invalidate a passing e2e result for the same SHA.
    types: [opened, synchronize, reopened, labeled]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

# Deny-by-default; each job grants what it needs.
permissions: {}

jobs:
  # Doc-only PR detection. Negation patterns + `predicate-quantifier: every`
  # mean a file matches `code` only if it sits OUTSIDE every doc path —
  # so the filter outputs `true` iff at least one changed file is non-doc.
  # Forgetting to add a new doc path here makes CI run unnecessarily on
  # that doc's changes, which is the safe failure mode (vs. an affirmative
  # `code: ['src/**', ...]` list, which would silently skip CI when a new
  # top-level config file was added but not listed). Push-to-main always
  # runs the full suite — main is the merge gate of last resort, so we
  # don't trust path filters there.
  #
  # Out of scope intentionally: dotfile-config changes (.gitignore,
  # .editorconfig, .gitattributes, .dockerignore, etc.) trigger CI. They
  # change rarely, can have real runtime/CI consequences when they do
  # (a wrong .dockerignore breaks image builds), and the cost of running
  # CI on them is negligible compared to the cost of silently skipping a
  # build-affecting change.
  changes:
    name: Detect doc-only changes
    runs-on: ubuntu-latest
    timeout-minutes: 2
    permissions:
      contents: read
      pull-requests: read
    outputs:
      code: ${{ github.event_name != 'pull_request' || steps.filter.outputs.code == 'true' }}
    steps:
      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        if: github.event_name == 'pull_request'
        id: filter
        with:
          predicate-quantifier: every
          filters: |
            code:
              - '!**/*.md'
              - '!design/**'
              - '!changelog.d/**'
              - '!todo.md'
              - '!PROGRESS.md'
              - '!LICENSE'
              - '!.github/ISSUE_TEMPLATE/**'

  pr-title:
    name: PR Title
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 2
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Validate Conventional Commits format
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: |
          set -euo pipefail
          echo "$PR_TITLE" | npx --yes \
            -p @commitlint/cli@20.5.0 \
            -p @commitlint/config-conventional@20.5.0 \
            commitlint

  check:
    name: Typecheck & Lint
    needs: [changes]
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm lint

  # Dockerfile lint. Runs against all three repo-owned Dockerfiles. Matrix
  # over files so a violation in one image reports independently. Config
  # in .hadolint.yaml at the repo root (auto-picked-up).
  hadolint:
    name: Hadolint (${{ matrix.dockerfile }})
    needs: [changes]
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    # hadolint-action is a Docker action — covers cold container build.
    timeout-minutes: 3
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        dockerfile:
          - Dockerfile
          - images/devbase/Dockerfile
          - images/skills/Dockerfile
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: hadolint/hadolint-action@06be81baf89a55ffd0e24b8f04a4185738dd3387 # v3.5.0
        with:
          dockerfile: ${{ matrix.dockerfile }}

  skills-runtime:
    name: Skills Runtime (Python)
    needs: [changes]
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      checks: write
    defaults:
      run:
        working-directory: images/skills
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          # Keep in sync with UV_VERSION in docker-bake.hcl — the single
          # source for the image's uv pin. (GitHub Actions can't read the
          # HCL variable, so this literal is the one manual mirror.)
          version: "0.12.5"
          enable-cache: true
          cache-dependency-glob: "images/skills/uv.lock"
      - run: uv sync --locked
      - name: ruff (lint + format)
        run: uv run ruff check
      - name: pyrefly (typecheck)
        run: uv run pyrefly check
      - name: pytest
        run: uv run pytest

  unit:
    name: Unit Tests
    needs: [changes]
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      checks: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Coverage instrumentation roughly doubles unit-test wallclock and
      # only feeds Codecov's main-branch trend line — PR-diff coverage
      # would still need a base report from main to compare against.
      # Limiting --coverage to main-push runs cuts ~half this job's
      # runtime on the high-volume PR-push path. Revisit if Codecov's
      # PR-coverage / patch-coverage reports become a desired signal —
      # those need both a base (main) and a head (PR) report.
      - name: Unit tests (with coverage)
        if: github.event_name == 'push'
        run: pnpm test --coverage --coverage.reportsDirectory=coverage/unit
      - name: Unit tests
        if: github.event_name != 'push'
        run: pnpm test
      - uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f # v7.0.0
        if: always() && github.event_name == 'push'
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          flags: unit
          files: apps/server/coverage/unit/lcov.info
      - uses: dorny/test-reporter@a43b3a5f7366b97d083190328d2c652e1a8b6aa2 # v3.0.0
        if: always()
        with:
          name: Unit Test Results
          path: apps/server/test-results/junit.xml
          reporter: java-junit

  # apps/web's tests run in their own job because the browser tier needs a
  # real Chromium (Playwright) — a distinct runtime from the server unit
  # tests' in-process PGlite. Separating it isolates the failure signal and
  # keeps the ~1-2 min browser install off the unit job's critical path.
  web:
    name: Web Tests
    needs: [changes]
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Bundle the SPA before the browser tests. `tsc` and the component tests
      # both miss module-resolution failures — a mismatched peer inside a
      # pre-1.0 dependency surfaces only when rollup actually resolves the
      # graph. The Dockerfile builds this too, but only the label-gated e2e
      # job reaches it, so without this step a broken bundle merges green.
      - run: pnpm --filter web build
      # Cache the Chromium binary keyed on the Playwright version so only the
      # ~110 MB download is skipped on a hit; `--with-deps` still runs apt below
      # (the OS libs aren't cacheable). Resolve the version after install so the
      # key tracks the actual pinned Playwright.
      - name: Resolve Playwright version
        id: pw
        working-directory: apps/web
        run: echo "version=$(node -p "require('playwright/package.json').version")" >> "$GITHUB_OUTPUT"
      - name: Cache Playwright browsers
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.pw.outputs.version }}
      # Node tier (chat converters) + Browser Mode tier (component/hook tests
      # in real Chromium). Install the browser + its OS libs before the run.
      - name: Install Playwright Chromium
        run: pnpm --filter web exec playwright install --with-deps chromium
      - name: Web tests (Node + browser-mode components)
        run: pnpm --filter web test

  integration:
    name: Integration Tests
    needs: [changes]
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      checks: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Log into Docker Hub
        if: env.DOCKERHUB_USERNAME != ''
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      # Same coverage rationale as the unit job — main-push only.
      - name: Integration tests (with coverage)
        if: github.event_name == 'push'
        run: pnpm test:integration --coverage --coverage.reportsDirectory=coverage/integration
        env:
          TESTCONTAINERS_RYUK_DISABLED: "true"
      - name: Integration tests
        if: github.event_name != 'push'
        run: pnpm test:integration
        env:
          TESTCONTAINERS_RYUK_DISABLED: "true"
      - uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f # v7.0.0
        if: always() && github.event_name == 'push'
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          flags: integration
          files: apps/server/coverage/integration/lcov.info
      - uses: dorny/test-reporter@a43b3a5f7366b97d083190328d2c652e1a8b6aa2 # v3.0.0
        if: always()
        with:
          name: Integration Test Results
          path: apps/server/test-results/junit.xml
          reporter: java-junit

  e2e:
    name: E2E Tests
    needs: [changes]
    # Run on every push to main (release-gate of last resort) and on PRs
    # only when explicitly opted in via the `e2e` label. PR-push runs are
    # the bulk of e2e cost (~3 min each, ~45 PR pushes/day), and most PRs
    # don't touch app code paths e2e exercises. The `labeled` activity
    # type on `on.pull_request` above means adding the label retriggers
    # the workflow on the current head SHA without a no-op commit.
    #
    # Label lifecycle: a passing run auto-removes the label (see the
    # final step below) so the next push doesn't re-run e2e until you
    # opt in again. A failing run leaves the label in place — the gate
    # stays sticky until at least one pass on the current change set.
    # `unlabeled` is intentionally absent from the workflow's activity
    # types, so the auto-removal doesn't fire another run.
    if: |
      needs.changes.outputs.code == 'true' && (
        github.event_name == 'push' ||
        contains(github.event.pull_request.labels.*.name, 'e2e')
      )
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      checks: write
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      # Build the cogmo app image via bake (same target + Dockerfile as
      # publish.yml) so e2e and publish share the GHA cache scope. Override
      # to amd64-only with a matching cache scope — multi-arch is for
      # release artifacts, not test verification, and an amd64-only build
      # writing to the arm64 scope would degrade the next release's arm64
      # cache hits (moby/buildkit#2758).
      # Tag overridden to `cogmo:ci` to match `E2E_IMAGE` below.
      - uses: docker/bake-action@d3418bd7d0e9324001bca92fa8ba175ea7e6dc9b # v7.3.0
        with:
          source: .
          files: ./docker-bake.hcl
          targets: cogmo
          load: true
          set: |
            cogmo.tags=cogmo:ci
            cogmo.platform=linux/amd64
            cogmo.cache-from=type=gha,scope=cogmo-amd64
            cogmo.cache-to=type=gha,scope=cogmo-amd64,mode=max
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Log into Docker Hub
        if: env.DOCKERHUB_USERNAME != ''
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - run: pnpm test:e2e
        env:
          E2E_IMAGE: cogmo:ci
          TESTCONTAINERS_RYUK_DISABLED: "true"
      - uses: dorny/test-reporter@a43b3a5f7366b97d083190328d2c652e1a8b6aa2 # v3.0.0
        if: always()
        with:
          name: E2E Test Results
          path: apps/server/test-results/junit.xml
          reporter: java-junit

      # Pass-only label cleanup — see the lifecycle comment on the e2e
      # `if:` above. Skips on push (no PR to edit) and when the label
      # isn't present (push-triggered e2e on main). `success()` ensures
      # we only clear the gate when the run was actually green.
      - name: Remove e2e label after green run
        if: |
          success() && github.event_name == 'pull_request' &&
          contains(github.event.pull_request.labels.*.name, 'e2e')
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh pr edit ${{ github.event.pull_request.number }} --remove-label e2e

  # Single required-status check fed into branch protection. Aggregates
  # every other job: success when all needs succeeded OR were legitimately
  # skipped (doc-only PR, push-not-PR for pr-title, no `e2e` label for
  # e2e). Failure of `changes` itself is NOT an allowed skip — if path
  # detection breaks, the whole pipeline must fail rather than silently
  # green. When you add a new job below, add it to both `needs:` and
  # `allowed-skips:` if it can be legitimately skipped.
  required-checks:
    name: Required Checks
    if: always()
    needs: [changes, pr-title, check, hadolint, skills-runtime, unit, web, integration, e2e]
    runs-on: ubuntu-latest
    timeout-minutes: 1
    steps:
      - uses: re-actors/alls-green@b5b5b37504aa4183270bd3d855c52a67f212be35 # v1.3.0
        with:
          jobs: ${{ toJSON(needs) }}
          allowed-skips: pr-title,check,hadolint,skills-runtime,unit,web,integration,e2e
