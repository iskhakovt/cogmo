name: CodeQL

# Pushing this workflow auto-deactivates GitHub's "default setup" — the
# advanced setup defined here takes over and respects the path filters
# in `.github/codeql/codeql-config.yml`.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    # Weekly at 04:00 UTC Monday — matches default-setup cadence.
    - cron: "0 4 * * 1"

permissions: {}

# One CodeQL run per ref. PR pushes that arrive before the previous run
# finishes cancel it; main is sequential to keep the Security tab
# coherent.
concurrency:
  group: codeql-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      security-events: write
      packages: read
      actions: read
      contents: read
    strategy:
      fail-fast: false
      matrix:
        # Mirrors what default-setup auto-detected for this repo.
        language: [actions, javascript-typescript, python]
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - uses: github/codeql-action/init@e4fba868fa4b1b91e1fdab776edc8cfbe6e9fb81 # v4.37.3
        with:
          languages: ${{ matrix.language }}
          config-file: ./.github/codeql/codeql-config.yml

      - uses: github/codeql-action/analyze@e4fba868fa4b1b91e1fdab776edc8cfbe6e9fb81 # v4.37.3
        with:
          category: "/language:${{ matrix.language }}"
