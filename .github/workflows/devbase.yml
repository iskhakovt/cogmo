name: Devbase Image

on:
  push:
    branches: [main]
    paths:
      - "images/devbase/**"
      - ".github/workflows/devbase.yml"
  pull_request:
    paths:
      - "images/devbase/**"
      - ".github/workflows/devbase.yml"
  workflow_dispatch:

concurrency:
  group: devbase-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

# Deny-by-default; the build job grants what it needs.
permissions: {}

jobs:
  build:
    name: Build & Push
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      # Logging in only matters when we'll push (main / dispatch). PR builds
      # are verification-only and skip the push.
      - if: github.event_name != 'pull_request'
        uses: docker/login-action@4907a6ddec9925e35a0a9e82d7399ccc52663121 # v4.1.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/metadata-action@030e881283bb7a6894de51c315a6bfe6a94e05cf # v6.0.0
        id: meta
        with:
          images: ghcr.io/${{ github.repository }}-devbase
          # Slice tag is the durable handle the supervisor pins via
          # COGMO_DEVBASE_IMAGE; sha tags exist for rollback to a specific
          # build of that slice.
          tags: |
            type=raw,value=slice1
            type=sha,prefix=slice1-,format=short

      - uses: docker/setup-buildx-action@4d04d5d9486b7bd6fa91e7baf45bbb4f8b9deedd # v4.0.0

      - uses: docker/build-push-action@bcafcacb16a39f128d818304e6c9c0c18556b85f # v7.1.0
        with:
          context: ./images/devbase
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=devbase
          cache-to: type=gha,mode=max,scope=devbase
          provenance: true
          sbom: true
